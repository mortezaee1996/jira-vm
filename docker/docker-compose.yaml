
services:
  postgres:
    image: postgres:16
    container_name: jira-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jira"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - jira-backend

  jira:
    image: atlassian/jira-software:10.3.9-ubi9-r5
    container_name: jira
    restart: unless-stopped
    init: true

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 2g
      JVM_MAXIMUM_MEMORY: 4g

    volumes:
      - jira_data:/var/atlassian/application-data/jira

    networks:
      - jira-backend

volumes:
  postgres_data:
  jira_data:

networks:
  jira-backend:
    driver: bridge
